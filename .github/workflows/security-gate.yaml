name: Turing Security Gate
on: [push, pull_request]

# Least privilege: este workflow só lê o repositório, nunca escreve nada
# nele - reduz o estrago possível se o workflow ou uma dependência dele
# for comprometida.
permissions:
  contents: read

jobs:
  security-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Run Turing Security Gate
        env:
          SECURITY_GATE_TOKEN: ${{ secrets.SECURITY_GATE_TOKEN }}
          REPO_URL: https://github.com/${{ github.repository }}
          # Em eventos de pull_request, github.ref_name traz a ref de merge
          # (algo como "123/merge"), não o nome real da branch - head_ref é
          # quem carrega o nome de verdade nesse caso.
          BRANCH: ${{ github.head_ref || github.ref_name }}
          TRIGGER: ${{ github.event_name }}
        run: |
          set -uo pipefail

          if [ -z "$SECURITY_GATE_TOKEN" ]; then
            echo "::error::SECURITY_GATE_TOKEN não está configurado. Cadastre em Settings > Secrets and variables > Actions."
            exit 1
          fi

          PAYLOAD=$(jq -n \
            --arg repo_url "$REPO_URL" \
            --arg branch "$BRANCH" \
            --arg trigger "$TRIGGER" \
            '{repo_url: $repo_url, branch: $branch, trigger: $trigger}')

          RESPONSE=$(curl -sS --max-time 30 --retry 2 --retry-delay 2 -X POST "https://security-gate.sec.turing.seg.br/scan" \
            -H "X-Security-Gate-Token: $SECURITY_GATE_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD")

          if [ -z "$RESPONSE" ] || ! echo "$RESPONSE" | jq -e . >/dev/null 2>&1; then
            echo "::error::Resposta inválida do Security Gate (rede ou token incorreto). Resposta recebida: $RESPONSE"
            exit 1
          fi

          STATUS=$(echo "$RESPONSE" | jq -r '.status // "fail"')
          echo "$RESPONSE" | jq -r '.sarif // "{}"' > turing-results.sarif

          echo "### Vulnerabilidades Encontradas ###"
          echo "$RESPONSE" | jq -r '.findings[]? | "- [" + .severity + "] " + .title + " (" + .file + ":" + (.line|tostring) + ")"'
          if [ "$(echo "$RESPONSE" | jq '.findings | length // 0')" = "0" ]; then
            echo "Nenhuma vulnerabilidade listada."
          fi

          if [ "$STATUS" = "fail" ]; then
            VIOLATIONS=$(echo "$RESPONSE" | jq -r '.violations[]?')
            if [ -n "$VIOLATIONS" ]; then
              echo "$VIOLATIONS" | while IFS= read -r v; do echo "::error::BLOQUEADO: $v"; done
            else
              echo "::error::BLOQUEADO: política de segurança violada."
            fi
            exit 1
          fi

      - name: Upload SARIF
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: turing-results
          path: turing-results.sarif
